name: Source image

# Builds Dockerfile.source and publishes it to ghcr.io/<owner>/minio.
# Manual only: Actions → Source image → Run workflow, on any branch or tag.
# Tags: RELEASE.<commit time> and sha-<short commit> for every build, plus
# latest when the run asks for it.

on:
  workflow_dispatch:
    inputs:
      latest:
        description: Also tag this build as latest
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from commit
        id: version
        run: |
          version=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=RELEASE.$(echo "$version" | tr ':' '-')" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/minio" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.source
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            MINIO_VERSION=${{ steps.version.outputs.version }}
            MINIO_COMMIT=${{ github.sha }}
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.release }}
            ${{ steps.version.outputs.image }}:sha-${{ steps.version.outputs.short }}
            ${{ inputs.latest && format('{0}:latest', steps.version.outputs.image) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.release }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max
